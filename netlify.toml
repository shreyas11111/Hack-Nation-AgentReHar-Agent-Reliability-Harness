# Netlify builds the standalone Vite dashboard, not the Python harness backend.
[build]
  base = "dashboard"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Keep direct links to dashboard views working after a refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[project]
name = "gauntlet-agent-reliability"
version = "0.1.0"
description = "Chaos engineering for AI agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "typer>=0.12", "rich>=13", "fastapi>=0.110", "uvicorn>=0.27", "openai>=1", "httpx>=0.27"]

[project.scripts]
gauntlet = "gauntlet.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
